name: Build game

on:
  push:
    branches: [main, master, 'claude/**']
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    name: Windows installer + portable exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: GameOfSarajevo-Windows
          path: |
            release/GameOfSarajevo-Setup-*.exe
            release/GameOfSarajevo-Portable-*.exe
          if-no-files-found: error

  web:
    name: Browser version (for itch.io)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - uses: actions/upload-artifact@v4
        with:
          name: GameOfSarajevo-Web
          path: dist/
          if-no-files-found: error
